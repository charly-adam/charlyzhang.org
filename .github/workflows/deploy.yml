# Builds the site and uploads it to Cloudflare Pages (project "charlyzhang").
# main -> production (charlyzhang.org); any other listed branch -> a preview at
# <branch>.charlyzhang.pages.dev. See .agents/knowledge/cloudflare-deploys.md.
name: Deploy

on:
  push:
    branches: [main, adam, charly]
  workflow_dispatch:

# A newer push to the same branch cancels the deploy still running for it.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

# (it only reads the repo; Cloudflare's token does the deploying)
permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PROJECT: charlyzhang
  WRANGLER: wrangler@4.152.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Create the Pages project the first time
        run: |
          npx --yes "$WRANGLER" pages project list | grep -qw "$PROJECT" \
            || npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch=main

      - name: Deploy
        run: npx --yes "$WRANGLER" pages deploy dist --project-name="$PROJECT" --branch="$GITHUB_REF_NAME" --commit-dirty=true

      - name: Summary
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then link=https://charlyzhang.org; else link="https://$GITHUB_REF_NAME.$PROJECT.pages.dev"; fi
          echo "Deployed **$GITHUB_REF_NAME** → $link" >> "$GITHUB_STEP_SUMMARY"
